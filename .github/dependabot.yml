version: 2
# Monthly: every merge runs CI and a deploy. Security updates don't wait for the schedule:
# they open when an advisory lands, grouped into one PR per ecosystem (the `security`
# groups, listed first so a dependency joins them before any other group).
updates:
  # Reads pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # PR title becomes "chore(deps): …", which merge-on-green's title check accepts.
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # apprise is upper-bounded (<3): its API changed in a major before (2.x's
      # notify() result), so a major is planned work, not a routine bump.
      - dependency-name: apprise
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Python version (3.13, also in .python-version and pyproject.toml) is a stack
      # decision: 3.13 -> 3.14 is a "minor" to Dependabot, so both are ignored here.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    # Action updates are low-risk and arrive together, majors included: one PR for all.
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        update-types: [major, minor, patch]
    ignore:
      # The standards' reusable workflows: a new major (v2) is breaking by definition and
      # is adopted as planned work, never inside a routine grouped PR.
      - dependency-name: "ki4hrg/standards*"
        update-types: [version-update:semver-major]
